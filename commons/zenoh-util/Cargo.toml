[package]
rust-version = { workspace = true }
name = "zenoh-util"
version = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
authors = [
    "kydos <angelo@icorsaro.net>",
    "Luca Cominardi <luca.cominardi@zettascale.tech>",
    "Pierre Avital <pierre.avital@zettascale.tech>",
]
edition = { workspace = true }
license = { workspace = true }
categories = { workspace = true }
description = "Internal crate for zenoh."
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[badges]
maintenance = { status = "actively-developed" }

[features]
test = []
opentelemetry = ["dep:tracing-opentelemetry", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]

[dependencies]
tokio = { workspace = true, features = ["time", "net"] }
async-trait = { workspace = true }
flume = { workspace = true }
home = { workspace = true }
humantime = { workspace = true }
lazy_static = { workspace = true }
libloading = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "std", "time"] }
shellexpand = { workspace = true }
zenoh-core = { workspace = true }
zenoh-result = { workspace = true, features = ["default"] }
const_format = { workspace = true }
serde = { workspace = true, features = ["default"] }
serde_json = { workspace = true }

# OpenTelemetry dependencies (optional)
tracing-opentelemetry = { version = "0.30.0", optional = true }
opentelemetry = { version = "0.29.1", optional = true }
opentelemetry_sdk = { version = "0.29.0", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.29.0", features = ["grpc-tonic"], optional = true }

[target.'cfg(windows)'.dependencies]
winapi = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
pnet_datalink = { workspace = true }

[dev-dependencies]
