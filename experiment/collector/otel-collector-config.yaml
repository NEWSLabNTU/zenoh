receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024

  resource:
    attributes:
      - key: collector.name
        value: zenoh-experiment-collector
        action: insert

exporters:
  # Console exporter for debugging
  debug:
    verbosity: normal
    sampling_initial: 10
    sampling_thereafter: 100
  
  # File exporter for persistent storage
  file:
    path: /tmp/zenoh-otlp-traces.jsonl
    rotation:
      max_megabytes: 100
      max_days: 7
      max_backups: 3

  # Jaeger exporter (if available)
  jaeger:
    endpoint: jaeger-collector:14250
    tls:
      insecure: true

service:
  telemetry:
    logs:
      level: info
  
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [debug, file]
      # Add jaeger to exporters if you have Jaeger running